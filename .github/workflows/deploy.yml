# Human-readable name shown in the repo's "Actions" tab.
name: Deploy portfolio to GitHub Pages

# WHEN this workflow runs.
on:
    # Every push to main triggers a fresh build + deploy, so merging a change is all it takes to update the live site.
    push:
        branches: ['main']
    # Adds a "Run workflow" button in the Actions tab, handy for redeploying without needing a dummy commit.
    workflow_dispatch:

# Permissions granted to the temporary token this workflow runs with.
# Least-privilege: read the code, write to Pages, and mint the OIDC
# token GitHub Pages uses to verify the deploy is legitimate.
permissions:
    contents: read
    pages: write
    id-token: write

# Only one deploy runs at a time; if you push twice quickly, the older
# in-progress run is cancelled so a stale build can't overwrite a newer one.
concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    deploy:
        # Links this job to the "github-pages" environment, which is what
        # makes the live URL show up on the run summary page.
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        # Fresh Linux VM for each run; GitHub destroys it afterwards.
        runs-on: ubuntu-latest
        steps:
            # Downloads your repo's code onto the VM.
            - name: Checkout
              uses: actions/checkout@v4

            # Installs Node on the VM. `cache: npm` stores downloaded packages
            # between runs, so later deploys skip re-downloading unchanged
            # dependencies and finish faster.
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # `npm ci` installs exactly what package-lock.json specifies
            # (unlike `npm install`, which can drift). This requires
            # package-lock.json to be committed to your repo.
            - name: Install dependencies
              run: npm ci

            # Runs Vite's production build, producing the static site in ./dist.
            - name: Build
              run: npm run build

            # Packages ./dist into the artifact format GitHub Pages expects.
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: './dist'

            # Publishes that artifact to Pages. `id: deployment` is what the
            # `url:` line near the top reads from.
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
